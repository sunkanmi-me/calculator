<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width"/> 
    <link rel="stylesheet" type="text/css" href="style.css">
    <title>Calculator</title>
  </head>

  <body>
      <header>
          <h1>Calculator</h1>
      </header>
      <main>
          <div id="calc-ctn"> 
              <div id="display">1234567890 </div>
              <div id="btns-ctn">
                  <div class="btn-row">
                      <button>CA</button>
                      <button>C</button>
                      <button>^</button>
                      <button>÷</button> 
                  </div>
                  <div class="btn-row">
                      <button>7</button>
                      <button>8</button>
                      <button>9</button>
                      <button>x</button> 
                  </div>
                  <div class="btn-row">
                      <button>4</button>
                      <button>5</button>
                      <button>6</button>
                      <button>-</button> 
                  </div>
                  <div class="btn-row">
                      <button>1</button>
                      <button>2</button>
                      <button>3</button>
                      <button>+</button> 
                  </div>
                  <div class="btn-row" id="l-row">
                      <button>0</button>
                      <button>=</button>
                  </div>
              </div>
                
          </div>
      </main>
      <footer>
          Made by <a href="https://www.sunkanmi.com" target="_blank" rel="noopener noreferrer">Sunkanmi</a>
      </footer>
    <script src="script.js"></script>
  </body>
</html>
